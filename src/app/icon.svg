<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Work Sync atom">
  <defs>
    <radialGradient id="orb" cx="32%" cy="28%" r="78%">
      <stop offset="0" stop-color="#394550"/>
      <stop offset=".34" stop-color="#171d24"/>
      <stop offset=".72" stop-color="#080b10"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#aebdca"/>
      <stop offset=".7" stop-color="#f3f7fa"/>
      <stop offset="1" stop-color="#718393"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation=".55" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="16" cy="16" r="15.25" fill="url(#orb)" stroke="#46525d" stroke-width=".7"/>
  <ellipse cx="11" cy="8" rx="5.4" ry="2.7" fill="#fff" opacity=".2" transform="rotate(-28 11 8)"/>
  <g class="atom" fill="none" stroke="url(#chrome)" stroke-width="1.15" stroke-linecap="round" filter="url(#glow)">
    <ellipse cx="16" cy="16" rx="11" ry="4.25"/>
    <ellipse cx="16" cy="16" rx="11" ry="4.25" transform="rotate(60 16 16)"/>
    <ellipse cx="16" cy="16" rx="11" ry="4.25" transform="rotate(-60 16 16)"/>
  </g>
  <g class="electrons" fill="#eef4f8" filter="url(#glow)">
    <circle cx="27" cy="16" r="1.45"/>
    <circle cx="10.5" cy="6.48" r="1.25"/>
    <circle cx="10.5" cy="25.52" r="1.2"/>
  </g>
  <circle cx="16" cy="16" r="2.05" fill="#f4f8fb" filter="url(#glow)"/>
  <style>
    .atom { transform-origin: 16px 16px; animation: atom-spin 3.2s linear infinite; }
    .electrons { transform-origin: 16px 16px; animation: electron-spin 2.4s linear infinite reverse; }
    @keyframes atom-spin { to { transform: rotate(360deg); } }
    @keyframes electron-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .atom, .electrons { animation: none; } }
  </style>
</svg>
